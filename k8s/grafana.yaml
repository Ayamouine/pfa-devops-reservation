apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasource.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
data:
  reservation-telemetry.json: |
    {
      "title": "PFA Réservation — Supervision",
      "uid": "pfa-reservation-supervision",
      "refresh": "30s",
      "time": { "from": "now-30m", "to": "now" },
      "timezone": "browser",
      "version": 1,
      "schemaVersion": 39,
      "panels": [
        {
          "type": "stat",
          "title": "Services monitorisés (up)",
          "id": 1,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "mappings": [ { "options": { "0": { "text": "DOWN" }, "1": { "text": "UP" } }, "type": "value" } ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [ { "expr": "up{job=~\\\".+-service\\\"}", "legendFormat": "{{job}}", "refId": "A" } ]
        },
        {
          "type": "timeseries",
          "title": "JVM Heap utilisé (octets)",
          "id": 2,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "stacking": { "mode": "none" }, "lineWidth": 2 }, "unit": "bytes" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [ { "expr": "sum(jvm_memory_used_bytes{area=\\\"heap\\\"}) by (application)", "legendFormat": "{{application}}", "refId": "A" } ]
        },
        {
          "type": "timeseries",
          "title": "CPU process (%)",
          "id": 3,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "stacking": { "mode": "none" }, "lineWidth": 2 }, "unit": "percent" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [ { "expr": "process_cpu_usage", "legendFormat": "{{application}}", "refId": "A" } ]
        },
        {
          "type": "timeseries",
          "title": "Requêtes HTTP (req/s)",
          "id": 4,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "stacking": { "mode": "none" }, "lineWidth": 2 }, "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [ { "expr": "sum(rate(http_server_requests_seconds_count{exception=\\\"None\\\"}[5m])) by (application)", "legendFormat": "{{application}}", "refId": "A" } ]
        },
        {
          "type": "timeseries",
          "title": "Threads JVM vivants",
          "id": 5,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "stacking": { "mode": "none" }, "lineWidth": 2 }, "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [ { "expr": "jvm_threads_live_threads", "legendFormat": "{{application}}", "refId": "A" } ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources
              subPath: datasource.yml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards/reservation-telemetry.json
              subPath: reservation-telemetry.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboard
          configMap:
            name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000