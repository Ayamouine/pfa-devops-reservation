server.port=8081
spring.application.name=auth-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
jwt.secret=${JWT_SECRET:my-super-secret-key-for-pfa-application-2026}
admin.registration.code=${ADMIN_REGISTRATION_CODE:pfa-admin-2026}
prof.registration.code=${PROF_REGISTRATION_CODE:pfa-prof-2026}
chef.registration.code=${CHEF_REGISTRATION_CODE:pfa-chef-2026}
doyen.registration.code=${DOYEN_REGISTRATION_CODE:pfa-doyen-2026}
server.error.include-message=always
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}