name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Build & test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - booking-service
          - notification-service
          - payment-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        working-directory: services/${{ matrix.service }}
        run: mvn -B clean verify

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build Docker images
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: auth-service
            context: services/auth-service
          - name: booking-service
            context: services/booking-service
          - name: notification-service
            context: services/notification-service
          - name: payment-service
            context: services/payment-service
          - name: frontend
            context: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pfa-${{ matrix.name }}:${{ github.sha }} ${{ matrix.context }}

      # To push these images to a registry (Docker Hub, GHCR, etc.), add a
      # login step here (using secrets for credentials) and a `docker push`
      # step after the build, tagging with your registry name.
