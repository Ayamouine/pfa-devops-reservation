name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: sha-${{ github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    name: Build & test ${{ matrix.service }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: booking_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        service:
          - auth-service
          - booking-service
          - notification-service
          - payment-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        working-directory: services/${{ matrix.service }}
        run: mvn -B clean verify

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build & push ${{ matrix.name }} to GHCR
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: auth-service
            context: services/auth-service
          - name: booking-service
            context: services/booking-service
          - name: notification-service
            context: services/notification-service
          - name: payment-service
            context: services/payment-service
          - name: frontend
            context: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image repo (lowercase)
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/${{ matrix.name }}:${{ env.IMAGE_TAG }} ${{ matrix.context }}

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/${{ matrix.name }}:${{ env.IMAGE_TAG }} ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/${{ matrix.name }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/${{ matrix.name }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/${{ matrix.name }}:latest

  e2e-tests:
    name: E2E tests (Cypress)
    needs: [docker-build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build stack & run Cypress
        run: |
          docker compose -f docker-compose.yml -f docker-compose.cypress.yml up \
            --build --abort-on-container-exit --exit-code-from cypress

      - name: Collect logs on failure
        if: failure()
        run: |
          {
            echo "=== docker ps -a ==="
            docker ps -a
            echo "=== cypress docker logs ==="
            cid=$(docker ps -aq --filter name=cypress 2>/dev/null | head -1)
            if [ -n "$cid" ]; then docker logs --tail=400 "$cid" 2>&1; fi
            echo "=== junit results ==="
            cat frontend/cypress/results/junit.xml 2>/dev/null || echo "(no junit.xml)"
            echo "=== compose logs ==="
            docker compose -f docker-compose.yml -f docker-compose.cypress.yml logs --tail=200
          } > /tmp/e2e_diag.log 2>&1 || true
          i=0
          split -b 45000 -d -a1 /tmp/e2e_diag.log /tmp/echunk_
          for f in /tmp/echunk_*; do
            echo "::error::[e2e]c$i $(base64 -w0 "$f" | tr -d '\n')"
            i=$((i+1))
          done

  deploy-kind:
    name: Deploy & health-check on Kubernetes (kind)
    needs: [docker-build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image repo (lowercase)
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Pull built images
        run: |
          for name in auth-service booking-service notification-service payment-service frontend; do
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/$name:${{ env.IMAGE_TAG }}
          done

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pfa-ci

      - name: Install default StorageClass (local-path) for the MySQL PVC
        run: |
          kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.26/deploy/local-path-storage.yaml
          kubectl patch storageclass local-path -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'

      - name: Load images into the cluster
        run: |
          for name in auth-service booking-service notification-service payment-service frontend; do
            kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/$name:${{ env.IMAGE_TAG }}
          done

      - name: Debug image load on failure
        if: failure()
        run: |
          {
            kind version
            kubectl cluster-info
            echo "--- docker image ls (any ghcr) ---"
            docker image ls --no-trunc | grep -i ghcr || echo "(no ghcr images found locally)"
            echo "--- re-run kind load per image (capture stderr) ---"
            for name in auth-service booking-service notification-service payment-service frontend; do
              img=${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/$name:${{ env.IMAGE_TAG }}
              echo "### kind load $img"
              kind load docker-image "$img" 2>&1 || echo "KIND LOAD FAILED for $name"
            done
          } > /tmp/kind_diag.log 2>&1 || true
          i=0
          split -b 45000 -d -a1 /tmp/kind_diag.log /tmp/kchunk_
          for f in /tmp/kchunk_*; do
            echo "::error::[kind]c$i $(base64 -w0 "$f" | tr -d '\n')"
            i=$((i+1))
          done

      - name: Apply manifests and pin image tags
        run: |
          kubectl apply -f k8s/
          for name in auth-service booking-service notification-service payment-service frontend; do
            kubectl set image deployment/$name $name=${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/$name:${{ env.IMAGE_TAG }}
          done

      - name: Wait for rollouts
        run: |
          for name in mysql auth-service booking-service notification-service payment-service frontend; do
            kubectl rollout status deployment/$name --timeout=300s
          done

      - name: Debug pods state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl get events --sort-by=.lastTimestamp | tail -80
          for name in mysql auth-service booking-service notification-service payment-service frontend; do
            pods=$(kubectl get pods -l app=$name -o name 2>/dev/null || true)
            for p in $pods; do echo "===== $p ====="; kubectl logs $p --tail=50 || true; done
          done

      - name: Health-check the microservices
        run: |
          kubectl run health-check --image=curlimages/curl:8.5.0 --restart=Never --rm -i --quiet --command -- sh -c '
            set -e
            curl -sf http://auth-service:8081/auth/health
            echo
            curl -sf http://booking-service:8082/bookings/health
            echo
            curl -sf http://notification-service:8083/notifications/health
            echo
            curl -sf http://payment-service:8084/payments/health
            echo
            echo "All services are up."
          '

      - name: Show deployment state
        run: kubectl get pods,deploy,svc,pvc -o wide