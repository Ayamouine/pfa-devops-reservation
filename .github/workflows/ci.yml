name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests - auth-service
        run: cd services/auth-service && mvn -B test

      - name: Run tests - booking-service
        run: cd services/booking-service && mvn -B test

      - name: Package auth-service
        run: cd services/auth-service && mvn -B -DskipTests package

      - name: Package booking-service
        run: cd services/booking-service && mvn -B -DskipTests package

      - name: Package notification-service
        run: cd services/notification-service && mvn -B -DskipTests package

      - name: Package payment-service
        run: cd services/payment-service && mvn -B -DskipTests package

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            services/auth-service/target/surefire-reports
            services/booking-service/target/surefire-reports

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-and-build-backend, build-frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build auth-service image
        run: docker build -t pfa-auth-service:ci ./services/auth-service

      - name: Build booking-service image
        run: docker build -t pfa-booking-service:ci ./services/booking-service

      - name: Build notification-service image
        run: docker build -t pfa-notification-service:ci ./services/notification-service

      - name: Build payment-service image
        run: docker build -t pfa-payment-service:ci ./services/payment-service

      - name: Build frontend image
        run: docker build -t pfa-frontend:ci ./frontend

      - name: Validate docker-compose configuration
        run: docker compose config
